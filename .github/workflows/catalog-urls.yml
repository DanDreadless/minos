name: Catalog lists

# The curated blocklist catalog points at third-party URLs that move
# without warning. Verifying them weekly turns "a user reports a broken
# one-click subscribe" into "CI tells us first". Runs on the GitHub
# mirror only — Gitea is a NAS container and never runs CI.
#
# This compiles every catalog list through the real parser rather than
# probing with HEAD. A 200 response proves nothing: a repurposed or
# emptied list, a format change, or a stale size hint all answer 200
# while the subscription silently protects nothing.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
  push:
    paths:
      - "web/src/lib/blocklists.ts"
      - "internal/lists/catalog_test.go"
      - ".github/workflows/catalog-urls.yml"

jobs:
  verify:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Downloads roughly 25 MB across the catalog, so the default 10m
      # go-test timeout is raised rather than left to bite on a slow day.
      - name: verify catalog lists compile
        run: go test -tags catalog -timeout 20m -v ./internal/lists -run TestCatalogListsCompile
